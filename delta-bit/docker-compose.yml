services:

  gui:
    build: ./GUI
    user: "${HOST_UID}:${HOST_GID}"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    working_dir: /app
    command: python data/gui.py

  tf:
    build: ./TF
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ./data:/app/data
    working_dir: /app
    command: bash

  tools:
    build: ./tools
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ./data:/data
    working_dir: /data
    command: bash
